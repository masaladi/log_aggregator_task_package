schema_version = "1.3"

[task]
name = "humanlaya/log-aggregator-incident"
authors = [{ name = "humanlaya", email = "noreply@example.com" }]

[agent]
# 60 分钟：筛选模型2 在 30 分钟预算内未能完成任务（agent execution timed
# out after 1800.0 seconds）。本题的探查与实现成本较高（约 900 万行数据、
# 单核全量解析 20 秒以上），需要为较慢的候选模型留足执行时间。
timeout_sec = 3600

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true

[verifier]
timeout_sec = 600

[metadata]
difficulty = "hard"
category = "chaotic-environment"
tags = ["linux", "troubleshooting", "deployment", "ops", "logging"]
